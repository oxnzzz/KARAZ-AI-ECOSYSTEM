schema_version: "1.0"

platforms:
  generic:
    status: "planned"
    adapter: "adapters/generic/"
    description: "Platform-independent skill format."

  chatgpt:
    status: "planned"
    adapter: "adapters/chatgpt/"
    notes: "Adoption depends on available ChatGPT features and permissions."

  gemini:
    status: "planned"
    adapter: "adapters/gemini/"
    notes: "Adoption depends on available Gemini features and permissions."

  grok:
    status: "future"
    adapter: "adapters/grok/"
    notes: "Reserved for future integration."

  claude:
    status: "future"
    adapter: "adapters/claude/"
    notes: "Reserved for future integration."

  manus:
    status: "future"
    adapter: "adapters/manus/"
    notes: "Reserved for future integration."

compatibility_levels:
  - compatible
  - compatible_with_adaptation
  - partially_supported
  - unsupported
  - unverified

rules:
  - "Never assume platform compatibility without verification."
  - "Never assume a skill is installed merely because it was retrieved."
  - "Preserve each AI assistant's independent identity and personality."
  - "Document platform-specific limitations."
  - "Verify required tools and permissions before execution."

skills:
  - skill_id: quality-guardian
    skill_version: "0.3.0"
    platforms:
      chatgpt:
        compatibility: unverified
        evidence: "Scenario evaluations QG-001 to QG-013 are recorded in core/quality-guardian/tests/test-results.md (QG-001 to QG-010 on skill 0.1.0, QG-011 on 0.2.0, QG-012 and QG-013 on 0.3.0)."
        limitations: "Run in the same session that loaded the skill, so not independent. Registration and activation were not verified. Complete responses are not preserved in this repository."
      gemini:
        compatibility: unverified
        evidence: "Scenario evaluations QG-011 (skill 0.2.0), QG-012 and QG-013 (skill 0.3.0) are recorded in core/quality-guardian/tests/test-results.md."
        limitations: "The user supplied the skill text; Gemini did not retrieve the repository. Registration and activation were not verified. Complete responses are not preserved in this repository."

